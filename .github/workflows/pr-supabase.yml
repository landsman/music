name: PR:Supabase

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - ".github/workflows/pr-supabase.yml"
      - "deno.lock"
      - "supabase/**"
      - "!**.md"
  workflow_dispatch:

permissions:
  pull-requests: write

env:
  PROJECT_ID: xxx
  PROJECT_PUBLISHABLE_KEY: yyy

jobs:
  qa:
    name: "QA"
    environment: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno fmt --check supabase/*
      - run: deno lint supabase/*
      - run: deno task tests --reload

      - name: "Generate cron jobs"
        uses: actions/upload-artifact@v7
        with:
          name: cron_jobs.sql
          path: cron_jobs.sql
          retention-days: 1

      - name: "Check Outdated Packages"
        uses: ./.github/action/deno-outdated
        id: outdated_supabase
        with:
          directory: ./supabase/functions
          title: "Deno Outdated - Supabase"

  # The scan lives in landsman/config and is called, not copied — one place to
  # change the scanner, the image or a default pack for every repo of mine.
  # Its own job so a finding reads as a finding rather than as a broken build.
  # p/typescript rather than a Deno pack: p/deno does not exist in the registry,
  # and this is TypeScript whatever runs it.
  security:
    uses: landsman/config/.github/workflows/semgrep.yml@main
    with:
      packs: p/secrets p/typescript
      path: supabase
