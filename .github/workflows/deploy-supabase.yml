name: Deploy Supabase

on:
  pull_request:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/deploy-supabase.yml"
      - "supabase/**"
      - "!**.md"
  workflow_dispatch:

# Limit GITHUB_TOKEN to read-only — all write operations use explicit secrets above
permissions:
  contents: read

jobs:
  deploy:
    environment: production
    # Self-hosted runner on Raspberry Pi 5 — see .docs/_self-hosted-runner.md
    runs-on: [self-hosted, pi5]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.24.3

      - name: "Sentry - Create release"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          npx @sentry/cli releases new ${{ github.sha }}
          npx @sentry/cli releases set-commits ${{ github.sha }} --auto
          npx @sentry/cli releases deploys ${{ github.sha }} new -e production

      - name: "Supabase - Remote Connect"
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          supabase link --project-ref $PROJECT_ID
          supabase db push
          supabase secrets set SENTRY_RELEASE=${{ github.sha }}
          supabase functions deploy --use-api

      - name: "Sentry - Finalize release"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: npx @sentry/cli releases finalize ${{ github.sha }}
