name: Deploy Supabase

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/deploy-supabase.yml"
      - "scripts/ci/**"
      - "supabase/**"
      - "!**.md"
  workflow_dispatch:

# Limit GITHUB_TOKEN to read-only — all write operations use explicit secrets above
permissions:
  contents: read

jobs:
  supabase-deploy:
    name: "Supabase - Deploy"
    # Self-hosted runner on Raspberry Pi 5 — see .docs/_self-hosted-runner.md
    runs-on: [self-hosted, pi5]
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v3
        with:
          version: 2.24.3

      - name: Upsert vault secrets
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: scripts/ci/supabase/upsert-vault-secret.sh

      - name: Remote connect + deploy
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: scripts/ci/supabase/deploy.sh

  sentry-release:
    name: "Sentry - Release"
    needs: supabase-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create + finalize release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: scripts/ci/sentry/release.sh
